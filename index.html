<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusCircle — Campus Clubs & Events Platform</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Navigation Bar -->
      <header class="app-header">
        <div class="header-container">
          <!-- Logo & Brand -->
          <div class="logo-area">
            <a href="#" class="logo" id="brand-logo">
              <span class="logo-icon">🎓</span>
              <span class="logo-text">CampusCircle</span>
            </a>
          </div>

          <!-- Primary Navigation Tabs -->
          <nav class="nav-tabs" id="main-nav">
            <button class="nav-tab active" data-tab="events">
              <span class="tab-icon">📅</span>
              <span class="tab-label">Events</span>
            </button>
            <button class="nav-tab" data-tab="clubs">
              <span class="tab-icon">🏛️</span>
              <span class="tab-label">Clubs</span>
            </button>
            <button class="nav-tab" data-tab="my-registrations" id="tab-my-registrations">
              <span class="tab-icon">🎟️</span>
              <span class="tab-label">My Registrations</span>
            </button>
            <button class="nav-tab hidden" data-tab="club-admin" id="tab-club-admin">
              <span class="tab-icon">🛠️</span>
              <span class="tab-label">Club Admin</span>
            </button>
            <button class="nav-tab hidden" data-tab="platform-admin" id="tab-platform-admin">
              <span class="tab-icon">🛡️</span>
              <span class="tab-label">Admin & Reports</span>
            </button>
          </nav>

          <!-- Role Selector Dropdown & Notification Bell -->
          <div class="user-controls">
            <!-- Notification Bell -->
            <div class="notif-bell-wrap">
              <button id="notif-bell-btn" class="bell-btn" aria-label="Notifications" title="Notifications">
                <span class="bell-icon">🔔</span>
                <span id="notif-badge" class="notif-badge hidden">0</span>
              </button>
              <div id="notif-dropdown" class="notif-dropdown hidden"></div>
            </div>

            <div class="role-selector-wrap">
              <span class="role-label-text">Viewing as:</span>
              <select id="role-select" class="role-dropdown" aria-label="Select User Role">
                <!-- Populated dynamically by SessionService -->
              </select>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Container -->
      <main id="main-content" class="main-content">
        <!-- Rendered dynamically by active module -->
      </main>

      <!-- App Footer -->
      <footer class="app-footer">
        <div class="footer-container">
          <p>© 2026 CampusCircle — Built with TypeScript & Vite (No Frameworks).</p>
          <p class="footer-subtext">Designed for university students, club organizers, and campus administration.</p>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
